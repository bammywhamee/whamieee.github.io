<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHAMIEE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap');

:root{
  --bg:#070707;--panel:#111;--panel2:#171717;--line:rgba(255,255,255,.12);
  --red:#ff2d50;--purple:#a56dff;--gold:#ffd34d;--muted:#8f8f8f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:#fff;font-family:Fredoka,sans-serif;background:
  radial-gradient(circle at 10% -10%,rgba(165,109,255,.14),transparent 28%),
  radial-gradient(circle at 95% 0%,rgba(255,45,80,.15),transparent 30%),
  var(--bg);
}
button,input{font-family:inherit}
a{color:inherit}

/* TOP NAV */
.top{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;
  padding:16px 28px;background:rgba(7,7,7,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{
  white-space:nowrap;font:800 35px/1 'Baloo 2',sans-serif;color:var(--red);
  text-shadow:3px 3px #fff,6px 6px rgba(255,45,80,.18)
}
.nav{display:flex;gap:22px;justify-content:center;flex:1}
.nav button{
  border:0;background:transparent;color:#c7c7c7;cursor:pointer;
  font-size:12px;font-weight:800;padding:7px 0
}
.nav button:hover,.nav button.active{color:#fff}
.nav button.active{border-bottom:2px solid var(--red)}
.search{
  display:flex;align-items:center;gap:8px;background:#151515;border:1px solid var(--line);
  border-radius:999px;padding:9px 12px
}
.search input{width:150px;border:0;outline:0;background:transparent;color:#fff}
.search input::placeholder{color:#6e6e6e}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* HERO */
.hero{
  min-height:520px;position:relative;display:flex;align-items:flex-end;overflow:hidden;
  background:linear-gradient(135deg,#141414,#090909)
}
.hero-bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.68}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.97),rgba(0,0,0,.68) 42%,rgba(0,0,0,.18) 75%),
             linear-gradient(0deg,var(--bg),transparent 52%)
}
.hero-inner{position:relative;z-index:3;padding:72px 6%;max-width:760px}
.kicker{
  display:inline-block;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,45,80,.6);
  background:rgba(255,45,80,.11);font-size:11px;font-weight:800
}
.hero h1{
  margin:16px 0 5px;font:800 clamp(60px,8vw,108px)/.82 'Baloo 2',sans-serif;
  color:var(--red);-webkit-text-stroke:2px #fff
}
.hero p{color:#d0d0d0;line-height:1.55;max-width:610px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.cta{
  border:1px solid var(--line);background:#191919;color:#fff;padding:12px 18px;
  border-radius:999px;font-size:11px;font-weight:800;cursor:pointer
}
.cta.primary{background:var(--red);border-color:transparent}

/* SECTIONS */
.section{padding:28px 5%}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}
.head h2{margin:0;font:800 31px/1 'Baloo 2'}
.head h2 span{color:var(--red)}
.head small{color:#737373}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:.22s
}
.card:hover{transform:translateY(-7px);border-color:rgba(255,45,80,.55);box-shadow:0 22px 55px rgba(0,0,0,.45)}
.poster{aspect-ratio:2/3;position:relative;overflow:hidden;background:linear-gradient(145deg,#1b1b1b,#090909)}
.poster img{width:100%;height:100%;object-fit:cover;display:none;transition:.3s}
.poster img.fit-contain{
  object-fit:contain;
  object-position:center;
  padding:8px;
  background:linear-gradient(145deg,#121212,#050505);
}
.card:hover .poster img.fit-contain{transform:none}
.card:hover .poster img{transform:scale(1.045)}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#727272;font-size:10px;padding:12px}
.placeholder b{display:block;font:800 18px/.95 'Baloo 2';color:#fff;margin-bottom:7px}
.card-info{padding:11px}
.card-info h3{margin:0;font:800 19px/.95 'Baloo 2'}
.card-info small{color:#777}
.card-btn{
  width:100%;margin-top:9px;padding:8px;border:1px solid var(--line);border-radius:9px;
  background:#191919;color:#fff;cursor:pointer;font-size:10px;font-weight:800
}
.card-btn:hover{background:var(--red)}

.card-btn.unavailable,
.episode button.unavailable,
.modal-watch-btn.unavailable{
  background:#151515 !important;
  border-color:#2a2a2a !important;
  color:#777 !important;
  cursor:not-allowed !important;
  opacity:.82;
  transform:none !important;
}
.card-btn.unavailable:hover,
.episode button.unavailable:hover,
.modal-watch-btn.unavailable:hover{
  background:#151515 !important;
  color:#777 !important;
}

.card-actions{
  display:grid;
  gap:7px;
  margin-top:9px;
}
.card-actions .card-btn{margin-top:0}
.favorite-btn{
  border-color:rgba(255,255,255,.17);
}
.favorite-btn.saved{
  background:rgba(255,45,80,.16);
  border-color:rgba(255,45,80,.58);
  color:#fff;
}
.favorite-btn.saved:hover{
  background:var(--red);
}
.modal-favorite-row{
  margin:12px 0 2px;
}
.modal-favorite{
  border:1px solid rgba(255,255,255,.18);
  background:#181818;
  color:#fff;
  border-radius:999px;
  padding:10px 15px;
  cursor:pointer;
  font-size:10px;
  font-weight:900;
  letter-spacing:.35px;
}
.modal-favorite.saved{
  background:rgba(255,45,80,.16);
  border-color:rgba(255,45,80,.58);
}

/* MOVIE FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:24px 5% 0}
.filter{
  border:1px solid var(--line);background:#111;color:#fff;border-radius:999px;padding:8px 11px;
  cursor:pointer;font-size:10px;font-weight:800
}
.filter.active,.filter:hover{border-color:rgba(255,45,80,.6);background:rgba(255,45,80,.11)}

/* MODAL / PLAYER */
.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(0,0,0,.82);backdrop-filter:blur(9px)
}
.modal.open{display:flex}
.modal-box{
  width:min(900px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid var(--line);
  border-radius:22px;box-shadow:0 40px 110px rgba(0,0,0,.7)
}
.modal-banner{min-height:300px;position:relative;background:center/cover no-repeat}
.modal-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#111,transparent 75%)}
.close{
  position:absolute;top:14px;right:14px;z-index:4;width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;cursor:pointer
}
.modal-body{padding:22px}
.modal-body h2{margin:0;font:800 40px/.9 'Baloo 2'}
.modal-body p{color:#c6c6c6;line-height:1.5}
.player{display:none;margin-top:16px}
.player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.player-note{font-size:10px;color:#777;margin-top:7px}
.player-controls{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px
}
.player-action{
  appearance:none;border:1px solid rgba(255,255,255,.18);background:#fff;color:#111;
  padding:10px 16px;border-radius:999px;font-weight:900;font-size:10px;letter-spacing:.35px;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center
}
.player-action:hover{transform:translateY(-1px);filter:brightness(.92)}
.player-action.secondary{background:#171717;color:#fff}
.fullscreen-status{
  display:none;margin-top:8px;padding:9px 11px;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;background:#161616;color:#bbb;font-size:10px;line-height:1.4;text-align:center
}

.seasons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.season{
  border:1px solid var(--line);background:#181818;color:#fff;border-radius:999px;padding:8px 11px;
  cursor:pointer;font-size:10px;font-weight:800
}
.season.active{background:rgba(255,45,80,.12);border-color:rgba(255,45,80,.55)}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.episode{padding:12px;border:1px solid var(--line);border-radius:12px;background:#161616}
.episode b{font-size:12px}
.episode small{display:block;color:#777;margin:4px 0 8px}
.episode-desc{font-size:11px;line-height:1.45;color:#aaa;margin:6px 0 8px}
.episode button{
  width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#1b1b1b;color:#fff;
  cursor:pointer;font-size:10px;font-weight:800
}
.episode button:hover{background:var(--red)}

/* EXTRAS SIDE DRAWER */
.extras-tab{
  position:fixed;right:0;top:45%;z-index:70;
  writing-mode:vertical-rl;transform:rotate(180deg);
  border:1px solid rgba(255,255,255,.14);border-right:0;
  background:rgba(16,16,16,.94);color:#fff;
  padding:13px 9px;border-radius:12px 0 0 12px;
  cursor:pointer;font-size:10px;font-weight:800;letter-spacing:1px
}
.extras-drawer{
  position:fixed;top:0;right:-340px;z-index:80;width:320px;height:100vh;
  background:rgba(13,13,13,.97);backdrop-filter:blur(18px);
  border-left:1px solid var(--line);padding:78px 18px 22px;
  transition:right .28s ease;overflow:auto
}
.extras-drawer.open{right:0}
.extras-drawer h2{font:800 31px/1 'Baloo 2';margin:0 0 8px}
.extras-drawer p{color:#8d8d8d;font-size:12px;line-height:1.5}
.extra-card{
  margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#151515
}
.extra-card b{display:block;margin-bottom:4px}
.extra-card small{color:#777}
.extra-close{
  position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:#191919;color:#fff;cursor:pointer
}


/* EXTRAS ACCESS LOCK */
.extras-lock{
  position:fixed;inset:0;z-index:120;
  display:none;align-items:center;justify-content:center;
  padding:22px;background:rgba(0,0,0,.78);backdrop-filter:blur(14px)
}
.extras-lock.open{display:flex}
.extras-lock-box{
  position:relative;width:min(390px,92vw);
  padding:30px 26px 25px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  background:linear-gradient(145deg,#181818,#0e0e0e);
  box-shadow:0 28px 80px rgba(0,0,0,.65);
  text-align:center
}
.extras-lock-icon{
  width:58px;height:58px;margin:0 auto 14px;
  display:grid;place-items:center;border-radius:50%;
  background:rgba(255,45,80,.12);
  border:1px solid rgba(255,45,80,.35);
  font-size:25px
}
.extras-lock-box h2{
  margin:0 0 7px;font:800 29px/1 'Baloo 2';letter-spacing:.4px
}
.extras-lock-box p{
  margin:0 auto 18px;max-width:290px;color:#8d8d8d;
  font-size:12px;line-height:1.5
}
.extras-code{
  width:100%;box-sizing:border-box;
  border:1px solid var(--line);border-radius:12px;
  background:#0b0b0b;color:#fff;
  padding:13px 14px;text-align:center;
  font-size:20px;font-weight:800;letter-spacing:8px;
  outline:none
}
.extras-code:focus{border-color:rgba(255,45,80,.7);box-shadow:0 0 0 3px rgba(255,45,80,.1)}
.extras-unlock-btn{
  width:100%;margin-top:11px;padding:12px 14px;
  border:0;border-radius:12px;background:var(--red);
  color:#fff;font-weight:900;letter-spacing:.7px;cursor:pointer
}
.extras-lock-msg{
  min-height:18px;margin-top:10px;
  color:#ff6078;font-size:11px;font-weight:800
}
.extras-lock-close{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:#171717;color:#fff;cursor:pointer
}
.extras-tab .lock-mark{margin-bottom:5px}

.footer{border-top:1px solid var(--line);margin-top:25px;padding:40px 5%;text-align:center;color:#666;font-size:11px}


.hero-dots{
  position:absolute;left:50%;bottom:24px;z-index:5;transform:translateX(-50%);
  display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:420px
}
.hero-dot{
  width:8px;height:8px;border:0;border-radius:999px;background:#777;cursor:pointer;padding:0;
  transition:.2s
}
.hero-dot.active{width:24px;background:#fff}


.hero-poster-shell{
  position:absolute;
  right:5%;
  bottom:48px;
  z-index:4;
  width:min(300px,22vw);
  aspect-ratio:2/3;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 28px 70px rgba(0,0,0,.65);
  background:#101010;
}
.hero-poster-shell img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#090909;
  display:block;
}
.hero-bg{
  filter:blur(1.5px) saturate(.9);
  transform:scale(1.025);
}
.card-desc{
  color:#929292;
  font-size:10px;
  line-height:1.35;
  margin-top:7px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:27px;
}
@media(max-width:850px){
  .hero-poster-shell{
    width:145px;
    right:14px;
    bottom:58px;
    opacity:.82;
  }
}
@media(max-width:560px){
  .hero-poster-shell{display:none}
}

@media(max-width:850px){
  .top{flex-wrap:wrap;padding:14px 15px}
  .nav{order:3;width:100%;justify-content:flex-start;overflow:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .extras-drawer{width:min(320px,90vw)}
}

/* GAMES SECTION */
.game-sites-section{
  margin-top:18px;
  padding-top:4px;
}
.game-sites-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(90deg,#171717,#101010);
  font-weight:900;
  letter-spacing:.9px;
  font-size:13px;
}
.game-sites-list{
  display:grid;
  gap:9px;
  margin-top:10px;
}
.game-site-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#111;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  transition:.18s ease;
}
.game-site-link:hover{
  transform:translateY(-1px);
  border-color:rgba(255,45,80,.55);
  background:#161616;
}
.game-site-link span:last-child{
  color:#777;
  font-size:14px;
}



/* COMING SOON SECTION */
.coming-soon-section{
  margin-top:18px;
  padding-top:4px;
}
.coming-soon-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(90deg,#171717,#101010);
  font-weight:900;
  letter-spacing:.9px;
  font-size:13px;
}
.coming-soon-list{
  display:grid;
  gap:9px;
  margin-top:10px;
}




/* YOUTUBE INSIDE EXTRAS */
.youtube-extras-section{
  margin-top:18px;
  padding-top:4px;
}
.youtube-extras-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-sizing:border-box;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(90deg,#171717,#101010);
  color:#fff;
  font-weight:900;
  letter-spacing:.9px;
  font-size:13px;
}
.youtube-under-tabs{
  display:grid;
  gap:8px;
  padding:9px 0 0 12px;
}
.youtube-under-tab{
  width:100%;
  text-align:left;
  border:1px solid rgba(255,255,255,.11);
  background:#0d0d0d;
  color:#bdbdbd;
  border-radius:9px;
  padding:9px 11px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.7px;
  cursor:pointer;
  transition:.18s ease;
}
.youtube-under-tab::before{
  content:"↳ ";
  color:var(--red);
}
.youtube-under-tab:hover{
  color:#fff;
  background:#151515;
  border-color:rgba(255,45,80,.5);
}
.skipvids-page-section{
  padding-top:26px;
}
.skipvids-page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}
.skipvids-page-head h2{
  margin:3px 0 0;
}
.skipvids-back-btn{
  border:1px solid var(--line);
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:9px 13px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}
.skip-vids-embed-area{
  width:100%;
  min-height:calc(100vh - 170px);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#080808;
  box-shadow:0 24px 70px rgba(0,0,0,.38);
}
.skip-vids-embed-area iframe{
  display:block;
  width:100%;
  height:calc(100vh - 170px);
  min-height:620px;
  border:0;
  background:#000;
}
.skip-vids-placeholder{
  min-height:calc(100vh - 170px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:8px;
  padding:30px;
  color:#777;
}
.skip-vids-placeholder b{
  color:#fff;
  font-size:28px;
  letter-spacing:1px;
}
.skip-vids-placeholder span{
  max-width:480px;
  font-size:12px;
  line-height:1.5;
}
@media (max-width:700px){
  .skip-vids-embed-area,
  .skip-vids-embed-area iframe,
  .skip-vids-placeholder{
    min-height:70vh;
    height:70vh;
  }
}


/* INSTAGRAM INSIDE EXTRAS */
.instagram-extras-section{
  margin-top:18px;
  padding-top:4px;
}
.instagram-extras-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-sizing:border-box;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(90deg,#171717,#101010);
  color:#fff;
  font-weight:900;
  letter-spacing:.9px;
  font-size:13px;
}


/* ---------- WHAMIEE GAMES PAGE ---------- */
.games-open-bar{
  width:100%;
  border:1px solid var(--line);
  color:#fff;
  cursor:pointer;
}
.games-open-bar:hover{
  border-color:rgba(255,45,80,.55);
  background:linear-gradient(90deg,#1c1c1c,#131313);
}
.games-page-hero{
  min-height:310px;
}
.games-page-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}
.game-library-card{
  overflow:hidden;
  border-radius:16px;
  border:1px solid var(--line);
  background:#111;
  transition:.2s ease;
}
.game-library-card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.25);
}
.game-cover{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#090909;
}
.game-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.game-cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.78));
  pointer-events:none;
}
.game-library-body{
  padding:14px;
}
.game-library-body h3{
  margin:0;
  font-size:18px;
}
.game-library-meta{
  margin-top:5px;
  color:#777;
  font-size:10px;
  font-weight:800;
  letter-spacing:.65px;
}
.game-library-desc{
  margin-top:9px;
  color:#999;
  font-size:11px;
  line-height:1.45;
  min-height:48px;
}
.game-library-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.game-play-btn{
  flex:1;
  border:0;
  border-radius:9px;
  padding:11px 12px;

      <h1 id="heroTitle">HOME</h1>

<script>
function toggleExtras(){document.getElementById('extrasDrawer').classList.toggle('open')}
function goPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById(`page-${p}`).classList.add('active');document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('active'));document.querySelector(`[data-page="${p}"]`).classList.add('active')}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>goPage(b.dataset.page)));
const CORRECT_CODE='1234';document.getElementById('whamieeMainUnlockBtn').addEventListener('click',()=>{const c=document.getElementById('whamieeMainCode').value;if(c===CORRECT_CODE){document.getElementById('whamieeMainLock').classList.add('unlocked');document.body.classList.remove('whamiee-site-locked')}else{document.getElementById('whamieeMainLockError').textContent='Invalid code. Try again!';document.getElementById('whamieeMainCode').value=''}});document.getElementById('whamieeMainCode').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('whamieeMainUnlockBtn').click()})
</script>
